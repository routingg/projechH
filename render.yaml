services:
  - name: wheeltrip-jeju-backend
    type: web
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://wheeltrip-jeju-frontend.onrender.com
      - key: RAG_SERVER_URL
        value: ""
      - key: KMA_API_KEY
        sync: false
      - key: JDC_API_KEY
        sync: false
      - key: DATA_GO_KR_API_KEY
        sync: false
      - key: KAKAO_REST_KEY
        sync: false

  - name: wheeltrip-jeju-frontend
    type: web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - source: /*
        destination: /index.html
        type: rewrite
    envVars:
      - key: VITE_API_BASE
        value: https://wheeltrip-jeju-backend.onrender.com
      - key: VITE_KAKAO_MAP_KEY
        sync: false
